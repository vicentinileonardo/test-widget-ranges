  name: demo-main-row
  namespace: demo-system
spec:
  apiRef:
    name: list-branches # todo: to be created
    namespace: demo-system
  widgetData:
    allowedResources:
      - columns
    alignment: top
    items:
      - resourceRefId: demo-sidebar-col
