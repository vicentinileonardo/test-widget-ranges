---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: PieChart
metadata:
  name: demo-pie-1
  namespace: demo-system
spec:
  apiRef:
    name: k8s-pods-list
    namespace: demo-system
  widgetData:
    title: Status
    series:
      total: 1
      data:
        - label: Loading...
          value: 1
          color: "gray"
  # Aggiorna i dati del grafico (Status e Colore)
  widgetDataTemplate:
    - forPath: series.data
      expression: >
        ${ [ { "label": .items[0].status, "value": 1, "color": .items[0].color } ] }
---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Markdown
metadata:
  name: demo-info-1
  namespace: demo-system
spec:
  apiRef:
    name: k8s-pods-list
    namespace: demo-system
  widgetData:
    markdown: "Loading info..."
  # Compila i dettagli testuali (ID e Data)
  widgetDataTemplate:
    - forPath: markdown
      expression: >
        ${ "**id:** " + (.items[0].id | tostring) + "\n\n**Date:** " + .items[0].date }
---
