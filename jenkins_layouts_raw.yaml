apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: k8s-pods-list
  namespace: demo-system
spec:
  api:
    - name: pipelines
      path: /api/v1/namespaces/krateo-system/pods
      verb: GET
  # Global filter applied to the final result
  filter: >
    {
      "items": [ .pipelines.items[] | {
        "name": .metadata.name,
        "id": .metadata.uid,
        "status": (if .status.phase == "Running" then "Running" elif .status.phase == "Succeeded" then "Success" else "Failed" end),
        "color": (if .status.phase == "Running" then "blue" elif .status.phase == "Succeeded" then "green" else "red" end),
        "date": .metadata.creationTimestamp,
        "link": ("https://cloudbees.cloud.insiel.it/job/benzapp-portale/job/" + .metadata.name)
      }]
    }

---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: NavMenuItem
metadata:
  name: demo-pipelines-nav-item
  namespace: demo-system
spec:
  widgetData:
    label: Pipelines
    icon: fa-rocket
    path: /pipelines
    order: 10
    allowedResources:
      - pages
    resourceRefId: demo-pipelines-page
  resourcesRefs:
    items:
      - id: demo-pipelines-page
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: pages
        name: demo-pipelines-page
        namespace: demo-system
        verb: GET
---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Page
