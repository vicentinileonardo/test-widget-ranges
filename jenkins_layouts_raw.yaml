---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Panel
metadata:
  name: demo-detail-panel-1
  namespace: demo-system
spec:
  # Collega il pannello alla RESTAction per aggiornare il Titolo
  apiRef:
    name: k8s-pods-list
    namespace: demo-system
  widgetData:
    actions: {}
    title: Loading...
    icon:
      name: "fa-user-astronaut"
    items:
      - resourceRefId: demo-detail-row-1
    footer:
      - resourceRefId: demo-footer-link-1
  # Sovrascrive il titolo con il nome del primo elemento (.items[0])
  widgetDataTemplate:
    - forPath: title
      expression: ${ .items[0].name }
  resourcesRefs:
    items:
      - id: demo-detail-row-1
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: rows
        name: demo-detail-row-1
        namespace: demo-system
        verb: GET
      - id: demo-footer-link-1
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: markdowns
        name: demo-footer-link-1
        namespace: demo-system
        verb: GET
---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Markdown
metadata:
  name: demo-footer-link-1
  namespace: demo-system
spec:
  apiRef:
    name: k8s-pods-list
    namespace: demo-system
  widgetData:
    markdown: "Loading link..."
  # Genera dinamicamente il link HTML nel footer
  widgetDataTemplate:
    - forPath: markdown
      expression: >
        ${ "[\(.items[0].link)](\(.items[0].link))" } 
---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Row
metadata:
  name: demo-detail-row-1
  namespace: demo-system
spec:
  widgetData:
    allowedResources:
      - piecharts
      - markdowns
    items:
      - resourceRefId: demo-pie-1
        size: 8
      - resourceRefId: demo-info-1
        size: 16
  resourcesRefs:
    items:
      - id: demo-pie-1
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: piecharts
        name: demo-pie-1
        namespace: demo-system
        verb: GET
      - id: demo-info-1
        apiVersion: widgets.templates.krateo.io/v1beta1
