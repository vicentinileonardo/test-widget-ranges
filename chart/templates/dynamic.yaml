# ---------------------------------------------------------------------
# 1. Recupero Dati via Lookup
# ---------------------------------------------------------------------
{{- $cm := lookup "v1" "ConfigMap" "demo-system" "demo-dashboard-data" }}
{{- $items := list }}
{{- if and $cm $cm.data (index $cm.data "items") }}
  {{- $items = $cm.data.items | fromJson }}
{{- end }}

apiVersion: widgets.templates.krateo.io/v1beta1
kind: Column
metadata:
  name: demo-content-col
  namespace: demo-system
spec:
  widgetData:
    allowedResources: [ panels ]
    items:
      # Ciclo per generare i riferimenti ai pannelli
      {{- range $index, $item := $items }}
      - resourceRefId: demo-detail-panel-{{ $index }}
      {{- end }}
  resourcesRefs:
    items:
      # Ciclo per definire i riferimenti alle risorse K8s
      {{- range $index, $item := $items }}
      - id: demo-detail-panel-{{ $index }}
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: panels
        name: demo-detail-panel-{{ $index }}
        namespace: demo-system
        verb: GET
      {{- end }}
---
# ---------------------------------------------------------------------
# 4. Generazione Widget Dinamici (Loop)
# ---------------------------------------------------------------------
{{- range $index, $item := $items }}
---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Panel
metadata:
  name: demo-detail-panel-{{ $index }}
  namespace: demo-system
spec:
  apiRef:
    name: branches-list
    namespace: demo-system
  widgetData:
    # $item qui è una stringa (es. "develop"), quindi la usiamo direttamente
    title: {{ $item | default "Loading..." }}
    icon: { name: "fa-code-branch" }
    items:
      - resourceRefId: demo-detail-row-{{ $index }}
    footer:
      - resourceRefId: demo-footer-link-{{ $index }}
  widgetDataTemplate:
    - forPath: title
      # Array di stringhe: accediamo direttamente all'indice
      expression: ${ .getBranches[{{ $index }}] }
  resourcesRefs:
    items:
      - id: demo-detail-row-{{ $index }}
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: rows
        name: demo-detail-row-{{ $index }}
        namespace: demo-system
        verb: GET
      - id: demo-footer-link-{{ $index }}
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: markdowns
        name: demo-footer-link-{{ $index }}
        namespace: demo-system
        verb: GET

---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Markdown
metadata:
  name: demo-footer-link-{{ $index }}
  namespace: demo-system
spec:
  apiRef:
    name: branches-list
    namespace: demo-system
  widgetData:
    markdown: "Go to branch..."
  widgetDataTemplate:
    - forPath: markdown
      # Costruiamo un link fittizio usando il nome del branch
      expression: >
        ${ "[\(.getBranches[{{ $index }}])](/git/repo/tree/\(.getBranches[{{ $index }}]))" }

---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Row
metadata:
  name: demo-detail-row-{{ $index }}
  namespace: demo-system
spec:
  widgetData:
    allowedResources: [ piecharts, markdowns ]
    items:
      - resourceRefId: demo-pie-{{ $index }}
        size: 8
      - resourceRefId: demo-info-{{ $index }}
        size: 16
  resourcesRefs:
    items:
      - id: demo-pie-{{ $index }}
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: piecharts
        name: demo-pie-{{ $index }}
        namespace: demo-system
        verb: GET
      - id: demo-info-{{ $index }}
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: markdowns
        name: demo-info-{{ $index }}
        namespace: demo-system
        verb: GET

---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: PieChart
metadata:
  name: demo-pie-{{ $index }}
  namespace: demo-system
spec:
  apiRef:
    name: branches-list
    namespace: demo-system
  widgetData:
    title: Status
    series:
      total: 1
      data:
        # Default statici poiché la stringa del branch non ha stato
        - label: "Active"
          value: 1
          color: "green"
  widgetDataTemplate:
    - forPath: series.data
      # Esempio: Se il branch è "develop" o "main" lo mettiamo verde, altrimenti blu
      expression: >
        ${ 
          if (.getBranches[{{ $index }}] == "main" or .getBranches[{{ $index }}] == "develop") 
          then [{ "label": "Protected", "value": 1, "color": "green" }] 
          else [{ "label": "Feature", "value": 1, "color": "blue" }] 
          end 
        }

---
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Markdown
metadata:
  name: demo-info-{{ $index }}
  namespace: demo-system
spec:
  apiRef:
    name: branches-list
    namespace: demo-system
  widgetData:
    markdown: "Loading info..."
  widgetDataTemplate:
    - forPath: markdown
      expression: >
        ${ "**Branch Name:** " + .getBranches[{{ $index }}] }
{{- end }}