apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: branches-list
  namespace: demo-system
spec:
  api:
    # 1. NEW STATE: Fetch and Sort
    - name: new
      path: /branches
      endpointRef:
        name: branch-server-endpoint
        namespace: demo-system
      filter: ".new.branches | sort"

    # 2. OLD STATE: Fetch Raw Object
    - name: oldRaw
      dependsOn:
        name: new
      path: /api/v1/namespaces/demo-system/configmaps/{{ .Release.Name }}
      verb: GET
      continueOnError: true
      # If 404, return {}, else return the full object
      filter: "if .oldRaw.code? == 404 then {} else .oldRaw end"

    # 3. GUARD & PUT if changed
    - name: update
      dependsOn:
        name: oldRaw
        # Pass 'labels' from oldRaw into the iterator item
        iterator: >-
          if (.new) == ((.oldRaw.data.items // "[]" | fromjson? | sort)) 
          then [] 
          else [ 
            { 
              "newItems": .new, 
              "resourceVersion": .oldRaw.metadata.resourceVersion,
              "labels": .oldRaw.metadata.labels
            } 
          ] 
          end
      path: /api/v1/namespaces/demo-system/configmaps/{{ .Release.Name }}
      verb: PUT
      headers:
        - "Content-Type: application/json"
      # Include .labels in the payload metadata
      payload: |
        ${
          {
            "apiVersion": "v1",
            "kind": "ConfigMap",
            "metadata": {
              "name": "{{ .Release.Name }}",
              "namespace": "demo-system",
              "resourceVersion": .resourceVersion,
              "labels": .labels,
              "annotations": {
                "krateo.io/last-updated": (now | todate) 
              }
            },
            "data": {
              "items": (.newItems | tojson)
            }
          } | .metadata |= with_entries(select(.value != null))
        }
