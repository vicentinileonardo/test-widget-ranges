apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: branches-list
  namespace: demo-system
spec:
  api:
    # 1. Retrieve Branches
    - name: getBranches
      path: /branches
      verb: GET
      endpointRef:
        name: branch-server-endpoint
        namespace: demo-system
      filter: ".getBranches.branches"

    # 2. Update ConfigMap
    - name: updateConfigMap
      dependsOn:
        name: getBranches
      path: /api/v1/namespaces/demo-system/configmaps/demo-dashboard-data
      verb: PUT
      headers:
        - "Content-Type: application/json"
      # FIX: Use a full JQ object construction wrapped in ${}
      # This ensures the payload is generated correctly before sending.
      payload: |
        ${
          {
            "apiVersion": "v1",
            "kind": "ConfigMap",
            "metadata": {
              "name": "demo-dashboard-data",
              "namespace": "demo-system"
            },
            "data": {
              "items": (.getBranches // [] | tojson)
            }
          }
        }