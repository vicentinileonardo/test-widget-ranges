apiVersion: v1
kind: ConfigMap
metadata:
  name: branch-server-code
data:
  app.py: |
    import json
    import random
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PORT = 8080

    # Small fixed pool of possible branches
    BRANCH_POOL = [
        "main",
        "develop",
        "feature/login",
        "feature/signup",
        "bugfix/header",
        "hotfix/payment",
        "release/v1.0",
        "release/v2.0",
        "experiment/new-ui",
        "experiment/ai-integration",
        "feature/dashboard",
        "feature/notifications",
        "bugfix/footer",
        "hotfix/api",
        "release/v1.1",
        "release/v2.1",
        "experiment/performance",
        "experiment/security"
    ]


    def get_time_bucket():
        """Returns current 5-minute bucket."""
        return int(time.time() // 600)  # 600 seconds = 10 minutes, adjust as needed for different intervals


    def generate_branches():
        """
        Generate deterministic random branches per 10-minute window.
        This ensures:
        - Same result within the same 10 minutes
        - Different result after 10 minutes
        """
        bucket = get_time_bucket()
        random.seed(bucket)
        size = random.randint(5, 15)
        return random.sample(BRANCH_POOL, size)


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/branches":
                branches = generate_branches()

                response = json.dumps({"branches": branches}).encode()

                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(response)))
                self.end_headers()
                self.wfile.write(response)
            else:
                self.send_response(404)
                self.end_headers()


    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), Handler)
        print(f"Server running on port {PORT}")
        server.serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: branch-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: branch-server
  template:
    metadata:
      labels:
        app: branch-server
    spec:
      containers:
      - name: branch-server
        image: python:3.11-slim
        command: ["python", "/app/app.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: branch-server-code

---
apiVersion: v1
kind: Service
metadata:
  name: branch-server
spec:
  selector:
    app: branch-server
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
